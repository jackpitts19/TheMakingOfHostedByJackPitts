name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Stage static files
        run: |
          STAGE="$(mktemp -d)"
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.vercel' \
            --exclude='__pycache__' \
            --exclude='*.py' \
            --exclude='*.sh' \
            --exclude='.gitignore' \
            --exclude='README.md' \
            --exclude='SETUP-CLOUDFLARE.md' \
            --exclude='tmo-podcast.skill' \
            --exclude='episodes.json' \
            --exclude='*.log' \
            --exclude='*.tmp' \
            ./ "$STAGE/"
          echo "stage_dir=$STAGE" >> "$GITHUB_OUTPUT"
        id: stage

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing required GitHub Secrets: CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          PROJECT="${CLOUDFLARE_PAGES_PROJECT:-themakingofhostedbyjackpitts}"
          npx --yes wrangler@latest pages deploy "${{ steps.stage.outputs.stage_dir }}" \
            --project-name="$PROJECT" \
            --branch="main"
